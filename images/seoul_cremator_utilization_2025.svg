<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title description">
  <title id="title">서울시립승화원 화장로 1기당 일평균 가동 횟수</title>
  <desc id="description">서울시설공단 권고기준 3.5회와 2025년 추정 가동 횟수 6.1회를 비교한 막대그래프</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="56" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="27" font-weight="700" fill="#222222">서울시립승화원 화장로 1기당 일평균 가동 횟수</text>
  <text x="450" y="88" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="14" fill="#777777">2025년 화장 44,411건 · 실가동 화장로 20기 가정</text>

  <line x1="135" y1="390" x2="765" y2="390" stroke="#aaaaaa" stroke-width="1"/>
  <line x1="135" y1="145" x2="765" y2="145" stroke="#eeeeee" stroke-width="1"/>
  <line x1="135" y1="267.5" x2="765" y2="267.5" stroke="#eeeeee" stroke-width="1"/>

  <rect x="245" y="267.5" width="130" height="122.5" fill="#d9d9d9"/>
  <rect x="525" y="177.1" width="130" height="212.9" fill="#a92127"/>

  <text x="310" y="251.5" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="28" font-weight="800" fill="#444444">3.5회</text>
  <text x="590" y="161.1" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="28" font-weight="800" fill="#a92127">6.1회</text>

  <text x="310" y="424" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#333333">일일 권고기준</text>
  <text x="590" y="424" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#333333">2025년 추정치</text>

  <rect x="235" y="462" width="430" height="58" fill="#fff3f3"/>
  <text x="450" y="488" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#a92127">권고기준의 1.74배</text>
  <text x="450" y="510" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" fill="#666666">기준보다 약 73.8% 높은 가동 수준</text>
</svg>
