<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title description">
  <title id="title">수도권 화장로와 시신 화장실적의 전국 비중</title>
  <desc id="description">2024년 수도권 화장로 비중 25.8퍼센트와 시신 화장실적 비중 39.6퍼센트를 비교한 막대그래프</desc>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="56" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="27" font-weight="700" fill="#222222">수도권 화장로·시신 화장실적 비중</text>
  <text x="450" y="88" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="14" fill="#777777">2024년 12월 말 기준 · 전국 대비</text>

  <line x1="135" y1="390" x2="765" y2="390" stroke="#aaaaaa" stroke-width="1"/>
  <line x1="135" y1="145" x2="765" y2="145" stroke="#eeeeee" stroke-width="1"/>
  <line x1="135" y1="267.5" x2="765" y2="267.5" stroke="#eeeeee" stroke-width="1"/>

  <rect x="245" y="263.6" width="130" height="126.4" fill="#d9d9d9"/>
  <rect x="525" y="196.0" width="130" height="194.0" fill="#a92127"/>

  <text x="310" y="247.6" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="28" font-weight="800" fill="#444444">25.8%</text>
  <text x="590" y="180.0" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="28" font-weight="800" fill="#a92127">39.6%</text>

  <text x="310" y="424" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#333333">화장로 비중</text>
  <text x="310" y="447" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" fill="#777777">103기</text>
  <text x="590" y="424" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#333333">시신 화장실적 비중</text>
  <text x="590" y="447" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" fill="#777777">135,222건</text>

  <rect x="235" y="474" width="430" height="58" fill="#fff3f3"/>
  <text x="450" y="500" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="16" font-weight="700" fill="#a92127">실적 비중이 13.8%p 높음</text>
  <text x="450" y="522" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" fill="#666666">화장로 비중 대비 약 1.53배 집중</text>
</svg>
